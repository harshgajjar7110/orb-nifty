default_variant: "DELTA_TARGETED"

dhan_strike_depth: 20  # Matches Dhan API ±20 strikes payload window around ATM

symbols:
  NIFTY:
    step_size: 50
    lot_size: 75
    default_otm_steps: 2
  BANKNIFTY:
    step_size: 100
    lot_size: 30
    default_otm_steps: 2
  FINNIFTY:
    step_size: 50
    lot_size: 25
    default_otm_steps: 2
  SENSEX:
    step_size: 100
    lot_size: 10
    default_otm_steps: 2
  DEFAULT_STOCK:
    step_size: 10
    lot_size: 500
    default_otm_steps: 2

delta_targets:
  credit_spread:
    short_leg_min: 0.15
    short_leg_max: 0.25
    short_leg_target: 0.20
    long_leg_min: 0.05
    long_leg_max: 0.10
    long_leg_target: 0.08
  debit_spread:
    long_leg_min: 0.50
    long_leg_max: 0.65
    long_leg_target: 0.55
    short_leg_min: 0.25
    short_leg_max: 0.35
    short_leg_target: 0.30
  straddle_strangle:
    delta_target: 0.50  # 0.50 for Straddle, 0.20 for Strangle

premium_targets:
  credit_spread_pct_min: 0.003  # 0.3% of spot price
  credit_spread_pct_max: 0.010  # 1.0% of spot price
  expected_move_sigma: 1.0      # 1-SD buffer

dex_vp_strategy_rules:
  va_percent: 0.70
  max_trade_risk_pct: 2.0
  max_daily_risk_pct: 5.0
  margin_cap_pct: 0.60
  confluence_thresholds:
    tier1: 80
    tier2: 60
    tier3: 40

# GEX + DEX aligned strike selection (WebBridge-driven Dhan Dext)
exposure_driven_rules:
  enabled: true
  default_variant: "GEX_DEX_ALIGNED"
  # How far OTM the long hedge is placed from the short strike (in strike steps)
  hedge_step_multiplier: 2
  # Minimum distance between short strike and spot for a credit spread
  min_otm_steps: 1
  # Priority order for support/resistance anchors.  Higher in list = preferred.
  up_direction_priority:
    - "put_support"
    - "delta_flip"
    - "gamma_flip"
    - "peak_neg_gamma_strike"
  down_direction_priority:
    - "call_wall"
    - "peak_pos_gamma_strike"
    - "delta_flip"
    - "gamma_flip"
